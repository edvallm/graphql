<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zone01 Profile</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1d27'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui' font-weight='700' font-size='16' fill='%237c6af7'%3E01%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Shared tooltip -->
  <div id="graph-tooltip" class="graph-tooltip"></div>

  <!-- ── Login view ── -->
  <div id="view-login" class="view">
    <div class="login-card">
      <h1>Zone01 Profile</h1>
      <form id="login-form" novalidate>
        <label for="credential">Username or Email</label>
        <input id="credential" type="text" autocomplete="username" placeholder="username or email" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="password" required />

        <p id="login-error" class="error hidden"></p>

        <button type="submit" id="login-btn">Sign in</button>
      </form>
    </div>
  </div>

  <!-- ── Profile view ── -->
  <div id="view-profile" class="view hidden">
    <header class="profile-header">
      <h1>My Profile</h1>
      <button id="logout-btn" class="btn-logout">Log out</button>
    </header>

    <main class="profile-main">

      <!-- Section 1: Basic info -->
      <section class="card" id="section-user">
        <h2>User Info</h2>
        <div id="user-info" class="info-grid"></div>
      </section>

      <!-- Section 2: XP -->
      <section class="card" id="section-xp">
        <h2>Experience Points</h2>
        <div id="xp-info" class="info-grid"></div>
      </section>

      <!-- Section 3: Audit ratio -->
      <section class="card" id="section-audit">
        <h2>Audit Ratio</h2>
        <div id="audit-info" class="info-grid"></div>
      </section>

      <!-- Section 4: Statistics -->
      <section class="card" id="section-stats">
        <h2>Statistics</h2>
        <div class="graph-wrap graph-wrap--full">
          <h3>XP Over Time</h3>
          <div id="graph-xp-time"></div>
        </div>
        <div class="graphs-grid">
          <div class="graph-wrap">
            <h3>Project Pass / Fail</h3>
            <div id="graph-pass-fail"></div>
          </div>
          <div class="graph-wrap">
            <h3>Skills Radar</h3>
            <div id="graph-skills"></div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
